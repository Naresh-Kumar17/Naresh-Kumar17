name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Profile SVGs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find profile-3d-contrib/ -type f ! -name 'profile-night-view.svg' -delete
          git add -A profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update 3D contribution graph"
            git push
          fi
