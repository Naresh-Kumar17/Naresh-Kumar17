name: Update README Assets

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout existing output branch as baseline
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: output
          path: dist

      - name: Ensure dist folder exists
        run: mkdir -p dist

      # Generate YOUR real snake animation
      - name: Generate the snake SVGs
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: Naresh-Kumar17
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Fetch and validate analytics graphics safely
      - name: Fetch and validate analytics graphics
        run: |
          fetch_safe () {
            local url="$1"
            local out="$2"
            local tmp="${out}.tmp"
            curl -sL --retry 3 --retry-delay 3 --max-time 20 "$url" -o "$tmp" || true
            if [ -s "$tmp" ] && grep -q "<svg" "$tmp"; then
              mv "$tmp" "$out"
              echo "Updated $out"
            else
              echo "Fetch failed or invalid for $out — keeping previous cached version"
              rm -f "$tmp"
            fi
          }

          fetch_safe "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=Naresh-Kumar17&theme=github_dark" "dist/stats.svg"
          fetch_safe "https://github-readme-streak-stats.herokuapp.com/?user=Naresh-Kumar17&theme=tokyonight&hide_border=true&background=0d1117&ring=38BDF8&fire=38BDF8&currStreakLabel=38BDF8" "dist/streak.svg"
          fetch_safe "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=Naresh-Kumar17&theme=github_dark" "dist/top-langs.svg"
          fetch_safe "https://github-readme-stats.vercel.app/api?username=Naresh-Kumar17&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=38BDF8&icon_color=38BDF8" "dist/stats-card.svg"

      - name: Confirm what will be published
        run: ls -la dist

      - name: Push assets to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
